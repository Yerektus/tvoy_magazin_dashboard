<div class="min-h-dvh bg-white max-lg:h-dvh max-lg:overflow-hidden">
  <div class="flex max-lg:h-full">
    <app-sidebar
      [items]="nav()"
      [loading]="navLoading()"
      [open]="sidebarOpen()"
      [user]="user()"
      (navigated)="closeOnPhone()"
      (logout)="logout()"
    >
      <app-target-picker sidebarActions slug="umag" width="w-full" />
    </app-sidebar>

    @if (sidebarOpen()) {
      <!-- Затемнение только на телефоне: там сайдбар лежит поверх страницы. -->
      <div
        class="animate-fade-in fixed inset-0 z-30 bg-neutral-900/30 lg:hidden"
        (click)="sidebarOpen.set(false)"
      ></div>
    }
    <!-- На телефоне скроллится только main: шапка остаётся на месте, как fixed. -->
    <div class="min-w-0 flex-1 max-lg:flex max-lg:h-full max-lg:min-h-0 max-lg:flex-col">
      <app-header
        [title]="pageTitle()"
        [sidebarOpen]="sidebarOpen()"
        (toggleSidebar)="sidebarOpen.set(!sidebarOpen())"
      />
      <main
        class="min-w-0 px-4 py-6 sm:px-6 max-lg:min-h-0 max-lg:flex-1 max-lg:overflow-y-auto max-lg:overscroll-y-contain"
      >
        <router-outlet />
      </main>
    </div>

    @if (assistant.open()) {
      <div
        class="animate-fade-in fixed inset-0 z-40 bg-neutral-900/30 lg:hidden"
        (click)="assistant.close()"
      ></div>
    }

    <app-chat-sidebar />
  </div>
</div>
