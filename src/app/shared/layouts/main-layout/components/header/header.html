<div class="px-4 sm:px-6">
  <div class="flex h-14 items-center justify-between gap-3">
    <span class="flex min-w-0 flex-1 items-center gap-2 sm:gap-4">
      <span class="lg:hidden">
        <app-button
          variant="secondary"
          size="lg"
          [icon]="true"
          [ariaLabel]="menuLabel()"
          [ariaExpanded]="sidebarOpen()"
          (click)="toggleSidebar.emit()"
        >
          <app-icon [icon]="menuIcon()" />
        </app-button>
      </span>
      <span class="hidden lg:contents">
        <app-button
          variant="ghost"
          [icon]="true"
          [ariaLabel]="menuLabel()"
          [ariaExpanded]="sidebarOpen()"
          (click)="toggleSidebar.emit()"
        >
          <app-icon [icon]="menuIcon()" [size]="18" />
        </app-button>
      </span>

      @if (page.crumbs().length) {
        <app-breadcrumbs [items]="page.crumbs()" />
      } @else {
        <span class="flex min-w-0 items-center gap-1.5 text-md font-normal">
          <span class="truncate">{{ title() }}</span>
          @if (page.suffix()) {
            <span class="text-neutral-500">/</span>
            <span class="truncate text-neutral-500">{{ page.suffix() }}</span>
          }
        </span>
      }
    </span>

    @if (page.actions(); as actions) {
      <div class="flex shrink-0 items-center gap-2">
        <ng-container *ngTemplateOutlet="actions" />
      </div>
    }
  </div>

  @if (page.tabs().length) {
    <app-tabs
      class="no-scrollbar -mb-px overflow-x-auto"
      [items]="page.tabs()"
      [active]="page.activeTab()"
      [badges]="page.badges()"
      (selected)="page.selectTab($event)"
    />
  }
</div>
