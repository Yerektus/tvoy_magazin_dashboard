<div class="relative flex h-full min-w-0 w-full flex-col">
  <button
    type="button"
    class="absolute inset-y-0 right-0 z-10 hidden w-1.5 cursor-col-resize touch-none bg-transparent hover:bg-blue-400/40 lg:block"
    [class.bg-blue-400/40]="dragging()"
    aria-label="Изменить ширину меню"
    (pointerdown)="startResize($event)"
    (pointermove)="onResize($event)"
    (pointerup)="endResize()"
    (pointercancel)="endResize()"
    (dblclick)="resetWidth()"
  ></button>
  <div class="flex h-14 items-center px-3">
    <span class="truncate px-2 text-xl font-normal">Твой магазин</span>
  </div>

  <nav class="flex flex-col gap-4 p-3">
    @if (loading()) {
      <div class="flex justify-center py-6 text-neutral-400">
        <app-spinner [size]="20" />
      </div>
    } @else {
      @for (group of groups(); track group.label) {
        <div class="flex flex-col gap-1" role="group" [attr.aria-label]="group.label">
          <p class="px-3 pb-0.5 text-xs text-neutral-400">{{ group.label }}</p>
          @for (item of group.items; track item.label) {
            @if (item.route) {
              <a
                [routerLink]="item.route"
                routerLinkActive="bg-neutral-200 font-medium text-neutral-900"
                class="flex items-center gap-2 rounded-sm px-3 py-1.5 text-sm text-neutral-600 transition hover:bg-neutral-200 hover:text-neutral-900"
                (click)="navigated.emit()"
              >
                <app-icon [icon]="item.icon" [size]="16" />
                <span class="min-w-0 truncate">{{ item.label }}</span>
              </a>
            } @else {
              <span
                class="flex items-center gap-2 rounded-sm px-3 py-1.5 text-sm text-neutral-400"
                title="Скоро"
              >
                <app-icon [icon]="item.icon" [size]="16" />
                <span class="min-w-0 truncate">{{ item.label }}</span>
              </span>
            }
          }
        </div>
      }
    }
  </nav>

  <!-- Внизу — магазин и кто вошёл. Выбор у края экрана раскрывается вверх. -->
  <div class="mt-auto flex flex-col gap-3 p-3">
    <ng-content select="[sidebarActions]" />

    <app-menu class="w-full" [customTrigger]="true" [fullWidth]="true" ariaLabel="Меню профиля">
      <button
        appMenuTrigger
        class="flex w-full cursor-pointer items-center gap-2 rounded-sm p-1 text-left transition hover:bg-neutral-200"
      >
        <app-avatar [email]="user()" />
        <span class="min-w-0 flex-1 truncate text-sm text-neutral-500">{{ user() }}</span>
      </button>

      <button appMenuItem class="text-red-600" (click)="logout.emit()">
        <app-icon [icon]="logoutIcon" [size]="14" />
        Выйти
      </button>
    </app-menu>
  </div>
</div>
