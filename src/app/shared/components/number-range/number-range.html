<!-- Поле выглядит как обычный инпут, а окно открывает клик по нему целиком. -->
<div
  role="button"
  tabindex="0"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  aria-label="Фильтр по количеству: выбрать диапазон"
  class="flex h-8 w-full cursor-pointer items-center rounded-md border border-neutral-200 bg-white pr-2 outline-none transition hover:border-blue-400 focus-visible:border-blue-400 focus-visible:ring-2 focus-visible:ring-blue-400/20"
  [class.border-blue-400]="open()"
  [class.ring-2]="open()"
  [class.ring-blue-400/20]="open()"
  (click)="toggle()"
  (keydown.enter)="toggle()"
  (keydown.space)="$event.preventDefault(); toggle()"
>
  <span
    class="min-w-0 flex-1 truncate px-2 text-left text-sm"
    [class.text-neutral-400]="!label()"
  >
    {{ label() || 'От - До' }}
  </span>

  @if (label()) {
    <button
      type="button"
      aria-label="Очистить диапазон"
      class="cursor-pointer rounded p-0.5 text-neutral-400 transition hover:bg-neutral-100 hover:text-neutral-600"
      (click)="clearTrigger($event)"
    >
      <app-icon [icon]="clearIcon" [size]="12" />
    </button>
  }
</div>

@if (open()) {
  <div
    #panel
    role="dialog"
    aria-label="Выбор диапазона"
    class="animate-fade-in fixed z-50 w-[260px] rounded-md border border-neutral-200 bg-white p-3 shadow-lg motion-reduce:animate-none"
    [style.top.px]="position().top"
    [style.left.px]="position().left"
  >
    <div class="grid grid-cols-2 gap-2">
      <label class="block">
        <span class="mb-1 block text-xs text-neutral-500">От</span>
        <input
          #fromInput
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="0"
          class="h-8 w-full rounded-md border border-neutral-200 bg-white px-2 text-sm outline-none placeholder:text-neutral-400 hover:border-blue-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20"
          [value]="draftFrom()"
          (input)="changeFrom($event)"
          (keydown.enter)="$event.preventDefault(); apply()"
        />
      </label>
      <label class="block">
        <span class="mb-1 block text-xs text-neutral-500">До</span>
        <input
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="0"
          class="h-8 w-full rounded-md border border-neutral-200 bg-white px-2 text-sm outline-none placeholder:text-neutral-400 hover:border-blue-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20"
          [value]="draftTo()"
          (input)="changeTo($event)"
          (keydown.enter)="$event.preventDefault(); apply()"
        />
      </label>
    </div>

    <div class="mt-2.5 flex items-center justify-between gap-2">
      <app-button variant="ghost" (click)="clear()">Сбросить</app-button>
      <app-button variant="primary" (click)="apply()">Применить</app-button>
    </div>
  </div>
}
