<button
  type="button"
  aria-haspopup="listbox"
  class="flex w-full cursor-pointer items-center justify-between border border-neutral-200 bg-white text-sm outline-none transition hover:border-blue-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20 disabled:cursor-default disabled:bg-slate-50 disabled:text-slate-400"
  [class.h-8]="compact()"
  [class.gap-2]="compact()"
  [class.rounded-md]="compact()"
  [class.px-2]="compact()"
  [class.gap-3]="!compact()"
  [class.rounded-sm]="!compact()"
  [class.px-3]="!compact()"
  [class.py-1.5]="!compact()"
  [class.border-blue-400]="open()"
  [class.ring-2]="open()"
  [class.ring-blue-400/20]="open()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-expanded]="open()"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <span
    class="truncate"
    [class.text-neutral-400]="empty()"
    [attr.title]="empty() ? null : label()"
    >{{ label() }}</span
  >

  <app-icon [icon]="chevronIcon" [size]="compact() ? 14 : 16" class="shrink-0 text-neutral-400" />
</button>

@if (open()) {
  <div
    #panel
    role="listbox"
    [attr.aria-multiselectable]="multiple() ? true : null"
    class="animate-fade-in fixed z-50 max-h-64 overflow-y-auto rounded-md border border-neutral-200 bg-white py-1 shadow-lg motion-reduce:animate-none"
    [style.top.px]="position().top"
    [style.left.px]="position().left"
    [style.min-width.px]="position().width"
  >
    @for (option of options(); track option.value) {
      <button
        type="button"
        role="option"
        class="flex w-full cursor-pointer items-center gap-3 px-3 py-1.5 text-left text-sm transition hover:bg-neutral-100"
        [class.justify-between]="!multiple()"
        [attr.aria-selected]="isSelected(option)"
        (click)="choose(option)"
      >
        @if (multiple()) {
          <span
            class="inline-flex h-4 w-4 shrink-0 items-center justify-center rounded-sm border"
            [class.border-neutral-300]="!isSelected(option)"
            [class.border-blue-500]="isSelected(option)"
            [class.bg-blue-500]="isSelected(option)"
            [class.bg-white]="!isSelected(option)"
          >
            @if (isSelected(option)) {
              <app-icon [icon]="checkIcon" [size]="12" [strokeWidth]="3" class="text-white" />
            }
          </span>
        }

        <span class="truncate">{{ option.label }}</span>

        @if (!multiple() && isSelected(option)) {
          <app-icon [icon]="checkIcon" [size]="14" class="shrink-0 text-blue-600" />
        }
      </button>
    } @empty {
      <p class="px-3 py-1.5 text-sm text-neutral-500">Выбирать пока не из чего</p>
    }
  </div>
}
