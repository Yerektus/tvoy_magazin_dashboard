<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="classes()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-busy]="loading() ? true : null"
>
  @if (loading()) {
    <app-spinner />
  } @else {
    <ng-content />
  }
</button>
