<span class="relative inline-flex h-4 w-4">
  <input
    type="checkbox"
    class="h-4 w-4 cursor-pointer appearance-none rounded-sm border border-neutral-300 bg-white transition hover:border-blue-400 checked:border-blue-500 checked:bg-blue-500 indeterminate:border-blue-500 indeterminate:bg-blue-500 disabled:cursor-default disabled:opacity-50"
    [checked]="checked()"
    [indeterminate]="indeterminate()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() || null"
    (change)="onChange($event)"
  />

  @if (indeterminate() || checked()) {
    <app-icon
      class="pointer-events-none absolute inset-0 items-center justify-center text-white"
      [icon]="indeterminate() ? minusIcon : checkIcon"
      [size]="12"
      [strokeWidth]="3"
    />
  }
</span>
