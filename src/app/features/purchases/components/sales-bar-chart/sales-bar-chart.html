@if (empty()) {
  <div class="flex h-64 items-center justify-center text-sm text-neutral-400">
    Недостаточно данных для графика
  </div>
} @else {
  <div
    class="w-full min-w-0"
    [class.overflow-x-auto]="pans()"
    [class.overscroll-x-contain]="pans()"
    [class.touch-pan-x]="pans()"
    [class.overflow-hidden]="!pans()"
  >
    <div
      class="relative h-64 w-full"
      [style.min-width.px]="pans() ? chartWidth() : null"
    >
      <canvas #chart class="block h-full w-full" [attr.aria-label]="caption()"></canvas>
    </div>
  </div>
}
