@if (empty()) {
  <div class="flex h-64 items-center justify-center text-sm text-neutral-400">
    Недостаточно данных для графика
  </div>
} @else {
  <div class="w-full">
    <div class="overflow-x-auto overscroll-x-contain">
      <div class="relative h-64 w-full" [style.min-width.px]="chartWidth()">
        <canvas #chart class="block" [attr.aria-label]="caption()"></canvas>
      </div>
    </div>

    @if (overlay()) {
      <div class="mt-3 flex flex-wrap items-center gap-4 text-xs text-neutral-500">
        <span class="inline-flex items-center gap-2">
          <span class="h-2.5 w-2.5 rounded-sm bg-[#8EC4EE]"></span>
          Факт
        </span>
        <span class="inline-flex items-center gap-2">
          <span class="h-0.5 w-4 bg-[#E08A3C]"></span>
          Прогноз
        </span>
      </div>
    }
  </div>
}
